services:
  frontend:
    build: .
    container_name: facturacion-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      # Dirección del backend a la que Nginx redirige /api y /uploads
      BACKEND_URL: ${BACKEND_URL:-http://facturacion-backend:8000}
    networks:
      - facturacion-net

# Red creada por el docker-compose del backend (levantar el backend primero).
networks:
  facturacion-net:
    external: true
    name: facturacion-net
